# Static serving for the Vite build. Single-page app: every unknown path is
# the client router's business, not a 404 — except /api, see below.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Container Apps terminates TLS upstream; this server never sees https.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml font/woff2;

    # /api must NOT fall through to index.html.
    #
    # Front Door routes /api/* to the API container app, so this location should
    # never be reached. If routing ever misfires it would otherwise serve HTML
    # where the client expects JSON, and the failure surfaces as an unhelpful
    # parse error somewhere deep in a screen. A bare 404 says what happened.
    location /api {
        return 404;
    }

    # Fingerprinted assets are immutable — Vite renames the file on any change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy leaves browsers loading an
    # old bundle that references assets which no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Container-level liveness. The container app currently defines no probes;
    # this exists so one can be added without another image build.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
